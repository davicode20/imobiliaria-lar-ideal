<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="1000" height="590" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d6efd">imobiliaria_lar_ideal_db — Modelo Lógico (DER)</text>

  <!-- usuarios -->
  <g transform="translate(30,70)">
    <rect width="250" height="150" rx="6" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.5"/>
    <rect width="250" height="30" rx="6" fill="#6c757d"/>
    <text x="125" y="20" text-anchor="middle" fill="#fff" font-weight="bold">usuarios</text>
    <text x="12" y="52">🔑 id INT (PK)</text>
    <text x="12" y="74">nome VARCHAR(100)</text>
    <text x="12" y="96">usuario VARCHAR(50) UNIQUE</text>
    <text x="12" y="118">senha_hash CHAR(64)</text>
    <text x="12" y="140">criado_em DATETIME</text>
  </g>
  <text x="155" y="245" text-anchor="middle" fill="#6c757d" font-size="12">(login do sistema — tabela independente)</text>

  <!-- clientes -->
  <g transform="translate(30,290)">
    <rect width="330" height="195" rx="6" fill="#f8f9fa" stroke="#0d6efd" stroke-width="1.5"/>
    <rect width="330" height="30" rx="6" fill="#0d6efd"/>
    <text x="165" y="20" text-anchor="middle" fill="#fff" font-weight="bold">clientes</text>
    <text x="12" y="52">🔑 id INT (PK)</text>
    <text x="12" y="74">nome VARCHAR(100)</text>
    <text x="12" y="96">cpf CHAR(11) UNIQUE</text>
    <text x="12" y="118">telefone VARCHAR(20)</text>
    <text x="12" y="140">email VARCHAR(100)</text>
    <text x="12" y="162">tipo ENUM(PROPRIETARIO, INTERESSADO, AMBOS)</text>
    <text x="12" y="184">criado_em DATETIME</text>
  </g>

  <!-- imoveis -->
  <g transform="translate(410,70)">
    <rect width="270" height="305" rx="6" fill="#f8f9fa" stroke="#198754" stroke-width="1.5"/>
    <rect width="270" height="30" rx="6" fill="#198754"/>
    <text x="135" y="20" text-anchor="middle" fill="#fff" font-weight="bold">imoveis</text>
    <text x="12" y="52">🔑 id INT (PK)</text>
    <text x="12" y="74" fill="#0d6efd" font-weight="bold">🔗 proprietario_id INT (FK)</text>
    <text x="12" y="96">titulo VARCHAR(100)</text>
    <text x="12" y="118">tipo ENUM(CASA, APARTAMENTO, …)</text>
    <text x="12" y="140">finalidade ENUM(VENDA, ALUGUEL)</text>
    <text x="12" y="162">endereco VARCHAR(150)</text>
    <text x="12" y="184">bairro VARCHAR(80)</text>
    <text x="12" y="206">cidade VARCHAR(80) = 'Palmas'</text>
    <text x="12" y="228">area_m2 DECIMAL(8,2)</text>
    <text x="12" y="250">quartos TINYINT UNSIGNED</text>
    <text x="12" y="272">valor DECIMAL(12,2)</text>
    <text x="12" y="294" font-size="11.5">status ENUM(DISPONIVEL, ALUGADO, VENDIDO)</text>
  </g>

  <!-- contratos -->
  <g transform="translate(705,250)">
    <rect width="285" height="215" rx="6" fill="#f8f9fa" stroke="#fd7e14" stroke-width="1.5"/>
    <rect width="285" height="30" rx="6" fill="#fd7e14"/>
    <text x="142" y="20" text-anchor="middle" fill="#fff" font-weight="bold">contratos</text>
    <text x="12" y="52">🔑 id INT (PK)</text>
    <text x="12" y="74" fill="#198754" font-weight="bold">🔗 imovel_id INT (FK)</text>
    <text x="12" y="96" fill="#0d6efd" font-weight="bold">🔗 cliente_id INT (FK)</text>
    <text x="12" y="118">tipo ENUM(LOCACAO, VENDA)</text>
    <text x="12" y="140">data_inicio DATE</text>
    <text x="12" y="162">data_fim DATE NULL</text>
    <text x="12" y="184">valor DECIMAL(12,2)</text>
    <text x="12" y="206" font-size="11.5">status ENUM(ATIVO, ENCERRADO, CANCELADO)</text>
  </g>

  <!-- clientes 1 — N imoveis -->
  <path d="M360,340 L385,340 L385,140 L410,140" fill="none" stroke="#0d6efd" stroke-width="2"/>
  <text x="366" y="333" fill="#0d6efd" font-weight="bold">1</text>
  <text x="396" y="133" fill="#0d6efd" font-weight="bold">N</text>
  <text x="378" y="250" fill="#0d6efd" font-size="12" transform="rotate(-90 378 250)" text-anchor="middle">possui (proprietário)</text>

  <!-- imoveis 1 — N contratos -->
  <path d="M680,140 L692,140 L692,320 L705,320" fill="none" stroke="#198754" stroke-width="2"/>
  <text x="683" y="133" fill="#198754" font-weight="bold">1</text>
  <text x="694" y="313" fill="#198754" font-weight="bold">N</text>
  <text x="842" y="200" fill="#198754" font-size="12" text-anchor="middle">imóvel 1 — N contratos</text>

  <!-- clientes 1 — N contratos -->
  <path d="M195,485 L195,515 L847,515 L847,465" fill="none" stroke="#0d6efd" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="202" y="502" fill="#0d6efd" font-weight="bold">1</text>
  <text x="854" y="482" fill="#0d6efd" font-weight="bold">N</text>
  <text x="520" y="508" fill="#0d6efd" font-size="12" text-anchor="middle">assina (inquilino / comprador)</text>

  <text x="500" y="565" text-anchor="middle" fill="#495057" font-size="12">
    Todas as FKs: ON DELETE RESTRICT · ON UPDATE CASCADE  ·  CHECK (data_fim IS NULL OR data_fim &gt;= data_inicio)
  </text>
</svg>
