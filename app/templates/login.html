{% extends "base.html" %}
{% block title %}Login · Lar Ideal{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="text-center text-primary mb-1"><i class="bi bi-house-door-fill"></i> Lar Ideal</h3>
        <p class="text-center text-muted mb-4">Sistema da Imobiliária</p>
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="usuario" class="form-control" value="{{ usuario_digitado or '' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
